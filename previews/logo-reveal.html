/* ===== lib/logo-reveal.js ===== */
/**
 * Sovstac logo reveal — a cinematic bracket sequence.
 *
 * The sequence: the frame boots sealed → unseals → opens, revealing your custom
 * line inside → closes, squeezing the line out of existence → seals (one hard
 * colour cut) → opens again and the six Michroma letters assemble around it,
 * revealing S[]VSTAC.
 *
 * THE IDEA: the brackets you watch the whole time ARE the "[]" in the wordmark.
 * They never become the logo — they are revealed to have been it all along.
 *
 * Three things are load-bearing, all established by measuring the real artwork:
 *
 * 1. THE BRACKET IS NOT A STROKED RECT. Its spine (27u) and arms (22u) are
 *    deliberately different weights. A stroked rect gives uniform weight, and a
 *    scaleX would thin the spines while stretching the arms. So each bracket is
 *    drawn as three filled rects — one spine, two arms — and the arm length is a
 *    driven variable. Nothing is ever scaled non-uniformly.
 *
 * 2. THE LETTERS ARE REAL MICHROMA. The wordmark's letters were verified to be
 *    unmodified Michroma Regular (pixel overlay against the asset, IoU > 0.97 per
 *    glyph), so they are typeset as live text rather than shipped as an image.
 *    Each letter is positioned by measuring its own rendered ink box and nudging
 *    it onto the exact x it occupies in the artwork — which sidesteps side
 *    bearings and kerning entirely, and gives us per-letter animation handles.
 *
 * 3. THE PAYOFF IS ONE TWEEN. The stage scales about the bracket pair's own
 *    centre. Because the brackets sit left of the wordmark's centre (x=415.5 of
 *    2000), a pure scale would leave the finished logo hanging off-centre, so the
 *    same tween also slides the stage left by (1000 - 415.5) × finalScale. Scale
 *    and slide run together, so it reads as one move: the frame settling into
 *    the wordmark that assembles around it.
 */


const svgEl = (tag, attrs = {}) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
function createLogoReveal(container, config, { onProgress } = {}) {
  let cfg = config;

  /* ---------------- DOM ---------------- */

  const svg = svgEl('svg', {
    width: '100%',
    height: '100%',
    xmlns: 'http://www.w3.org/2000/svg',
  });
  Object.assign(svg.style, { display: 'block', position: 'absolute', inset: '0' });

  // Everything lives in wordmark coordinates inside this group. The group's
  // transform is what moves/scales the whole film.
  const stage = svgEl('g');

  // The custom line is clipped to the chamber interior, so when the frame closes
  // the text is physically squeezed out of existence rather than fading — the
  // boundary destroys it. (Stolen from the "Containment" direction.)
  const clipId = `sv-chamber-${Math.floor(performance.now())}`;
  const defs = svgEl('defs');
  const clip = svgEl('clipPath', { id: clipId });
  const clipRect = svgEl('rect');
  clip.appendChild(clipRect);
  defs.appendChild(clip);

  // The letters get their own aperture clip for the payoff sweep: a letter only
  // EXISTS between the brackets, wiped into view by the frame opening across it.
  // That is what makes the sweep a REVEAL — and it makes bracket-over-letter
  // overlap impossible while the brackets are travelling outward (the left
  // bracket crosses the S's position mid-sweep; without this the S would fade
  // in underneath it). The clip is released the instant the sweep completes, so
  // the fly-in still passes BEHIND the finished wordmark.
  const lettersClipId = `${clipId}-letters`;
  const lettersClip = svgEl('clipPath', { id: lettersClipId });
  const lettersClipRect = svgEl('rect');
  lettersClip.appendChild(lettersClipRect);
  defs.appendChild(lettersClip);

  const textGroup = svgEl('g', { id: 'sv-text', 'clip-path': `url(#${clipId})` });
  const customText = svgEl('text', {
    'text-anchor': 'middle',
    'dominant-baseline': 'middle',
  });
  textGroup.appendChild(customText);

  const lettersGroup = svgEl('g', { id: 'sv-letters' });
  const letterNodes = W.letters.map(({ ch }) => {
    const t = svgEl('text', { x: 0, y: W.baseline });
    t.textContent = ch;
    lettersGroup.appendChild(t);
    return t;
  });

  // Each bracket: spine + top arm + bottom arm. Never scaled, only re-laid-out.
  const mk = side => ({
    spine: svgEl('rect', { class: `sv-spine sv-${side}` }),
    top: svgEl('rect', { class: `sv-arm sv-${side}` }),
    bottom: svgEl('rect', { class: `sv-arm sv-${side}` }),
  });
  const L = mk('l');
  const R = mk('r');
  const bracketGroup = svgEl('g', { id: 'sv-brackets' });
  [L, R].forEach(b => bracketGroup.append(b.spine, b.top, b.bottom));

  const rule = svgEl('rect', { height: 1 });

  // Z-ORDER IS LOAD-BEARING: brackets go BEHIND the letters.
  //
  // The pair is centred at x=415.5 of a 2000-wide wordmark — left of centre — so any
  // symmetric opening sends the right bracket straight across V-S-T-A-C. There is no
  // width at which both brackets clear the letters. Painted on top, the spines slice
  // through the glyphs and it reads as a rendering bug.
  //
  // Behind them, the letters occlude the spines, and the frame appears to travel BEHIND
  // the wordmark and surface in the one place nothing covers it: the empty slot it
  // belongs in. The collision becomes the effect.
  stage.append(defs, textGroup, bracketGroup, lettersGroup, rule);
  svg.appendChild(stage);
  container.appendChild(svg);

  /* ---------------- animated state ----------------
     GSAP tweens this plain object; every tick re-draws the geometry from it.
     That's what makes the parametric bracket possible. */

  const S = {
    chamber: W.restChamber,   // clear width between the spines' inner faces
    // Offset of the chamber's centre from the pair's home (pairCx), in wordmark
    // units. Zero through the whole first act. On the final reveal it slides to
    // the wordmark's centre so the frame can open past BOTH ends of S..C — the
    // pair lives left of centre, so a symmetric opening could never clear the C.
    shift: 0,
    // 1 = the wordmark letters are gated by the aperture (payoff sweep: the
    // opening frame wipes them into view), 0 = unclipped (fly-in: the brackets
    // pass behind the finished wordmark). A .set state, so scrubs reverse it.
    letterWipe: 1,
    armReach: W.restArmReach, // how far each arm reaches in from its spine
    scale: 1,
    px: 0,                    // where the pair centre lands on screen, x
    py: 0,
    frameOpacity: 0,
    textOpacity: 0,
    ruleScale: 0,
    // 0 = working (pale), 1 = sealed (accent), 2 = final lockup.
    // This is a STATE value, not a callback, so that scrubbing backwards through
    // the seal correctly un-does the colour. A gsap .call() would not reverse.
    fillPhase: 0,
  };

  let vw = 0;
  let vh = 0;
  // How wide the frame opens for the current text. Set in build(), read in draw()
  // to derive the text's scale from the chamber.
  let openTo = W.restChamber;
  // Vertical nudge (wordmark units) that centres the text's INK BOX between the
  // bracket ends — dominant-baseline is metric-based and lands mixed-case lines
  // (ascenders one side, descenders the other) visibly off-centre.
  let textDy = 0;

  const heroScale = () => cfg.geometry.heroBracketHeight / (W.bracketBottom - W.bracketTop);
  const finalScale = () => cfg.geometry.logoWidth / W.viewBox[2];

  /** Where the pair centre must sit so the FINISHED wordmark is centred. */
  const finalPx = () => vw / 2 - (W.viewBox[2] / 2 - W.pairCx) * finalScale();

  /**
   * BEATS 1–4 MATCH BEAT 5 ONWARDS: the custom line has the same relationship to
   * the brackets as the wordmark letters do — its ink box spans the bracket
   * height (times the Text Height %). Font metrics differ per family, so this
   * fits by measurement: render at a probe size, measure the ink box, scale to
   * the target, then centre the ink between the bracket ends.
   */
  function fitTextSize() {
    const probe = 100;
    const mid = (W.bracketTop + W.bracketBottom) / 2;
    customText.setAttribute('font-size', probe);
    customText.setAttribute('y', mid);

    const target = (W.bracketBottom - W.bracketTop) * (cfg.content.textSize / 100);
    let box = null;
    try {
      box = customText.getBBox();
    } catch { /* not rendered yet */ }
    if (!box || !box.height) {
      customText.setAttribute('font-size', target * 0.8);
      textDy = 0;
      return;
    }
    customText.setAttribute('font-size', probe * (target / box.height));

    try {
      const b = customText.getBBox();
      textDy = mid - (b.y + b.height / 2);
    } catch {
      textDy = 0;
    }
  }

  /**
   * How wide the frame opens: as wide as your line needs, and no wider.
   *
   * Measures the text as actually rendered (so it responds to the font, height
   * and tracking you pick), then adds padding each side. No viewport clamp here —
   * if the line is long, build() shrinks the WHOLE hero to fit the screen, so the
   * text keeps its bracket-height relationship instead of shrinking inside a
   * fixed frame.
   */
  function openChamberFor() {
    const g = cfg.geometry;
    fitTextSize();

    if (!g.autoFit) return g.openChamber;

    let textW = 0;
    try {
      textW = customText.getBBox().width;
    } catch {
      textW = 0; // not laid out yet — fall back to the manual width
    }
    if (!textW) return g.openChamber;

    const min = W.restChamber + 60;
    return Math.max(min, textW + g.textPadding * 2);
  }

  function draw() {
    const { spine, armThickness: at, bracketTop: y0, bracketBottom: y1, pairCx } = W;
    const cx = pairCx + S.shift; // where the chamber is centred right now
    const half = S.chamber / 2;
    const armLen = Math.max(0, S.armReach);

    // Left bracket: spine sits outside the chamber, arms reach in.
    const lSpineX = cx - half - spine;
    L.spine.setAttribute('x', lSpineX);
    L.spine.setAttribute('y', y0);
    L.spine.setAttribute('width', spine);
    L.spine.setAttribute('height', y1 - y0);

    for (const [arm, ay] of [[L.top, y0], [L.bottom, y1 - at]]) {
      arm.setAttribute('x', lSpineX);
      arm.setAttribute('y', ay);
      arm.setAttribute('width', spine + armLen);
      arm.setAttribute('height', at);
    }

    // Right bracket: mirror.
    const rSpineX = cx + half;
    R.spine.setAttribute('x', rSpineX);
    R.spine.setAttribute('y', y0);
    R.spine.setAttribute('width', spine);
    R.spine.setAttribute('height', y1 - y0);

    for (const [arm, ay] of [[R.top, y0], [R.bottom, y1 - at]]) {
      arm.setAttribute('x', rSpineX - armLen);
      arm.setAttribute('y', ay);
      arm.setAttribute('width', spine + armLen);
      arm.setAttribute('height', at);
    }

    // The chamber interior — what the custom text is clipped to. Full bracket
    // height: the text is as tall as the frame now, and the brackets paint OVER
    // the text group, so an arm passing a glyph corner reads as the frame in
    // front — not as clipping.
    clipRect.setAttribute('x', cx - half);
    clipRect.setAttribute('y', y0);
    clipRect.setAttribute('width', S.chamber);
    clipRect.setAttribute('height', y1 - y0);

    // The letters' aperture gate — full height (letter ink runs a hair past the
    // bracket ends), spine-to-spine in x. Applied only while letterWipe is on.
    lettersClipRect.setAttribute('x', cx - half);
    lettersClipRect.setAttribute('y', y0 - 40);
    lettersClipRect.setAttribute('width', S.chamber);
    lettersClipRect.setAttribute('height', y1 - y0 + 80);
    if (S.letterWipe >= 0.5) lettersGroup.setAttribute('clip-path', `url(#${lettersClipId})`);
    else lettersGroup.removeAttribute('clip-path');

    customText.setAttribute('x', pairCx);
    customText.setAttribute('y', (y0 + y1) / 2 + textDy);

    // The text is CARRIED by the frame, not merely revealed inside it. Its scale is
    // derived from the chamber width rather than tweened separately, so it is exactly
    // as open as the brackets are: it grows as they part, and as they close it is
    // drawn in with them and crushed to nothing at the seal. Deriving it (instead of
    // running a parallel tween) means the two can never drift out of sync.
    const span = openTo - W.restChamber;
    const ts = span > 0 ? Math.max(0, Math.min(1, (S.chamber - W.restChamber) / span)) : 1;
    const midY = (y0 + y1) / 2;
    textGroup.setAttribute(
      'transform',
      `translate(${pairCx} ${midY}) scale(${ts}) translate(${-pairCx} ${-midY})`
    );

    // Stage transform: scale about the pair centre, land it at (px, py).
    stage.setAttribute(
      'transform',
      `translate(${S.px} ${S.py}) scale(${S.scale}) translate(${-pairCx} ${-(y0 + y1) / 2})`
    );

    // Derived, not commanded — so it survives a reverse scrub.
    const p = cfg.palette;
    setBracketFill(
      S.fillPhase >= 2 ? p.bracketFinal : S.fillPhase >= 1 ? p.bracketSealed : p.bracketIdle
    );

    bracketGroup.style.opacity = S.frameOpacity;
    textGroup.style.opacity = S.textOpacity;

    rule.setAttribute('x', 0);
    rule.setAttribute('y', W.baseline + 46);
    rule.setAttribute('width', W.viewBox[2] * S.ruleScale);
    rule.setAttribute('height', 1.5);
    rule.style.opacity = cfg.content.showRule ? 0.28 : 0;
  }

  /** Position each letter by measuring its ink box and nudging it onto target x. */
  function layoutLetters() {
    const size = W.capHeight * 1.3333; // Michroma cap height is 1536/2048 em
    letterNodes.forEach((node, i) => {
      const spec = W.letters[i];
      node.setAttribute('font-family', 'Michroma');
      node.setAttribute('font-size', size);
      node.setAttribute('fill', cfg.palette.letters);
      node.setAttribute('x', 0);
      node.style.transform = 'none';

      let box;
      try {
        box = node.getBBox();
      } catch {
        return; // not rendered yet
      }
      // Shift so the glyph's ink lands exactly where it does in the artwork.
      node.dataset.finalX = String(spec.x0 - box.x);
      node.setAttribute('x', spec.x0 - box.x);
    });
  }

  function applyStyle() {
    const p = cfg.palette;
    [L, R].forEach(b => [b.spine, b.top, b.bottom].forEach(r => r.setAttribute('fill', p.bracketIdle)));
    letterNodes.forEach(n => n.setAttribute('fill', p.letters));

    customText.setAttribute('fill', p.text);
    customText.setAttribute('font-family', cfg.content.textFont);
    // font-size is owned by fitTextSize() — textSize is a height %, not units.
    customText.setAttribute('letter-spacing', `${cfg.content.textTracking}em`);
    customText.textContent = cfg.content.text;

    rule.setAttribute('fill', p.rule);
  }

  function setBracketFill(color) {
    [L, R].forEach(b => [b.spine, b.top, b.bottom].forEach(r => r.setAttribute('fill', color)));
  }

  function resize() {
    vw = container.clientWidth || 1;
    vh = container.clientHeight || 1;
    svg.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
    draw();
  }

  /* ---------------- the timeline ---------------- */

  let tl = null;

  function build() {
    tl?.kill();

    const { timing: t, easing: e, geometry: g, palette: p } = cfg;
    const ms = n => n / 1000; // GSAP works in seconds

    // How far the frame opens — sized to the text unless you've turned autoFit off.
    openTo = openChamberFor();

    // The hero scale, shrunk if the open frame wouldn't fit the viewport. The
    // ENSEMBLE shrinks — bracket and text together — so the text keeps its
    // bracket-height relationship no matter how long the line is.
    let hs = heroScale();
    const maxUnits = (vw - 48) / hs - W.spine * 2;
    if (maxUnits > 0 && openTo > maxUnits) hs *= maxUnits / openTo;

    // Reset to the sealed hero state.
    Object.assign(S, {
      chamber: W.restChamber,
      shift: 0,
      letterWipe: 1,
      armReach: g.armRest,
      scale: hs,
      px: vw / 2,
      py: vh / 2,
      frameOpacity: 0,
      textOpacity: 0,
      ruleScale: 0,
      fillPhase: 0,
    });
    lettersGroup.style.opacity = 1;
    letterNodes.forEach(n => gsap.set(n, { opacity: 0, y: 0 }));
    draw();

    tl = gsap.timeline({
      paused: true,
      defaults: { onUpdate: draw },
      repeat: t.loop ? -1 : 0,
      repeatDelay: ms(t.loopDelay),
      // Redraw on every tick, including seeks — so scrubbing repaints correctly.
      onUpdate: () => {
        draw();
        onProgress?.(tl.progress(), tl.duration());
      },
      onComplete: () => onProgress?.(1, tl.duration()),
    });
    tl.timeScale(t.speed);

    // ACT 1 — the sealed frame exists.
    tl.addLabel('boot', 0)
      .to(S, { frameOpacity: 1, duration: ms(t.bootIn), ease: 'expo.out' }, 'boot');

    tl.addLabel('unseal1', `+=${ms(t.hold1)}`)
      // The seal breaks before the walls move: arms retract, then the frame parts.
      .to(S, { armReach: g.armOpen, duration: ms(t.unseal1), ease: e.unseal }, 'unseal1')
      // BEAT 2 IS BEAT 4 IN REVERSE. The line doesn't fade in after the doors are
      // already open — it is REVEALED by the opening. Its scale is derived from the
      // chamber, so the parting brackets drag it out of the slit exactly the way
      // the closing ones will crush it back in. Opacity just snaps on in the first
      // sliver of travel — the mirror of the kill at the end of the close.
      .to(S, { textOpacity: 1, duration: ms(t.textIn), ease: e.text }, `unseal1+=${ms(t.unseal1 * 0.6)}`)
      .to(S, { chamber: openTo, duration: ms(t.open1), ease: e.open }, `unseal1+=${ms(t.unseal1 * 0.6)}`);

    tl.addLabel('close', `+=${ms(t.holdText)}`)
      // The text needs no fade of its own: its scale is derived from the chamber, so
      // the closing frame drags it inward and crushes it out of existence. It goes
      // with the brackets.
      .to(S, { chamber: W.restChamber, duration: ms(t.close1), ease: e.close }, 'close')
      .to(S, { armReach: g.armRest, duration: ms(t.seal1), ease: 'power2.out' }, `close+=${ms(t.close1 - t.seal1 * 0.55)}`)
      // Belt and braces: kill the opacity in the last sliver of travel so a 1px shard
      // of glyph can't strobe at the seal.
      .to(S, { textOpacity: 0, duration: 0.12, ease: 'power2.in' }, `close+=${ms(t.close1 - 120)}`);

    // THE SEAL — the only highlight in the film, and it is a CUT, not a fade.
    // A machine latches instantaneously; it does not cross-dissolve.
    // A zero-duration .set (not .call) so a reverse scrub restores the pale state.
    tl.addLabel('engage')
      .set(S, { fillPhase: 1 }, 'engage')
      // A 5-unit compression and release. Felt, not seen — the door meeting its stop.
      .to(S, { chamber: W.restChamber - 5, duration: 0.1, ease: 'power2.in' }, 'engage')
      .to(S, { chamber: W.restChamber, duration: 0.1, ease: 'power2.out' }, '>');

    // ACT 3 — controlled disclosure, in a deliberate order:
    //
    //   1. the frame swings WIDE and the whole stage scales down into logo position
    //   2. the six letters assemble — leaving the bracket slot EMPTY. For a beat you
    //      are looking at "S[ ]VSTAC" with nothing in the brackets' place: a hole.
    //   3. the brackets FLY IN and seat into that hole, completing the wordmark.
    //
    // That's the whole thesis made literal. The logo is incomplete without the frame,
    // and the frame you've been watching is the piece that completes it.
    //
    // Times are computed absolutely from here on, because the beats have to be
    // sequenced against each other rather than appended.
    const payoffAt = tl.duration() + ms(t.holdSealed);

    // The frame opens past BOTH ends of the wordmark — the whole of SOVSTAC will
    // assemble INSIDE it, so the reveal covers the full text, not just the slot.
    // The pair lives left of centre, so the chamber's centre has to slide to the
    // wordmark's centre while it opens (a symmetric opening could never clear the C).
    const wideChamber = W.viewBox[2] + g.revealMargin * 2;
    const wideShift = W.viewBox[2] / 2 - W.pairCx;

    tl.addLabel('payoff', payoffAt)
      .set(S, { fillPhase: 2 }, payoffAt)
      .to(S, { armReach: g.armOpen, duration: ms(t.unseal1), ease: e.unseal }, payoffAt)
      // The payoff transform: the frame sweeps out to embrace the whole wordmark
      // while the stage scales down and recentres — all ONE move, one ease, so the
      // brackets read as travelling outward to their framing position, not flying
      // off on their own schedule.
      .to(S, {
        chamber: wideChamber,
        shift: wideShift,
        scale: finalScale(),
        px: finalPx(),
        duration: ms(t.payoff),
        ease: e.payoff,
      }, payoffAt)
      // The sweep is done: the whole wordmark sits inside the frame, so the
      // aperture gate comes off. From here the letters are unclipped and the
      // fly-in brackets pass BEHIND them. (.set, so a reverse scrub re-gates.)
      .set(S, { letterWipe: 0 }, payoffAt + ms(t.payoff));

    // The letters assemble OUTWARD from the brackets, not left-to-right — so the empty
    // slot reads as the origin of the wordmark. A goes last: its box overlaps T's by 49
    // units (Michroma's own T/A kern), so it must settle INTO the T rather than travel
    // across it. Everything moves on y + opacity, never on x.
    const order = [0, 1, 2, 3, 5, 4]; // S V S T C A — A last
    const lettersAt = payoffAt + ms(t.payoff) * 0.45;

    order.forEach((idx, n) => {
      tl.fromTo(
        letterNodes[idx],
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: ms(t.letterDur), ease: e.letters },
        lettersAt + ms(n * t.letterStagger)
      );
    });

    const lettersEnd = lettersAt + ms((order.length - 1) * t.letterStagger + t.letterDur);

    // THE ARRIVAL. The wordmark now sits there with a hole in it. Hold on that, then
    // the brackets sweep in over the letters and seat into their slot. They are drawn
    // last, so they pass over the letterforms like a closing shutter.
    const arriveAt = lettersEnd + ms(t.holdEmpty);

    tl.addLabel('arrive', arriveAt)
      // Chamber and shift travel together: the left bracket steps in past the S,
      // the right sweeps in from beyond the C, both passing BEHIND the letters,
      // and they seat into the empty slot at the same instant.
      .to(S, { chamber: W.restChamber, shift: 0, duration: ms(t.collapse), ease: e.close }, arriveAt)
      // The arms re-arm as the spines touch down — the slit narrows to its true 15u.
      .to(
        S,
        { armReach: g.armRest, duration: ms(t.seal1), ease: 'power3.out' },
        arriveAt + ms(t.collapse - t.seal1 * 0.55)
      );

    // The one ornament, and it is the brand's own: a 1px hairline rule.
    tl.addLabel('rule', arriveAt + ms(t.collapse) - 0.1)
      .to(S, { ruleScale: 1, duration: ms(t.ruleIn), ease: 'power4.inOut' }, arriveAt + ms(t.collapse) - 0.1);

    return tl;
  }

  /* ---------------- init ---------------- */

  const ro = new ResizeObserver(() => {
    resize();
    // finalPx depends on viewport width, so the payoff has to be re-derived.
    const p = tl?.progress() ?? 0;
    const wasPlaying = tl && !tl.paused();
    build();
    tl.progress(p);
    if (wasPlaying) tl.play();
  });
  ro.observe(container);

  applyStyle();
  resize();
  build();

  // Fonts must land before getBBox() means anything — it's what positions the Michroma
  // letters AND what measures the text to size the opening. So rebuild once they're in,
  // or the first play would use fallback-font metrics.
  document.fonts.ready.then(() => {
    layoutLetters();
    build();
    draw();
    onProgress?.(0, tl.duration());
  });

  const api = {
    play: () => tl.play(),
    pause: () => tl.pause(),
    toggle: () => (tl.paused() ? tl.play() : tl.pause()),
    restart: () => tl.restart(),
    seek: p => tl.progress(p),
    isPaused: () => tl.paused(),
    duration: () => tl.duration(),
    progress: () => tl.progress(),

    /** Re-apply config. Rebuilds the timeline and holds your place in it. */
    update(next) {
      cfg = next;
      applyStyle();
      layoutLetters();
      const p = tl?.progress() ?? 0;
      const wasPlaying = tl && !tl.paused();
      build();
      tl.progress(p);
      if (wasPlaying) tl.play();
      draw();
    },

    dispose() {
      tl?.kill();
      ro.disconnect();
      svg.remove();
    },
  };

  return api;
}

const W = WORDMARK;

/* ===== lib/control-panel.js ===== */
/**
 * Sovstac control panel.
 *
 * Schema-driven: it reads SCHEMA from config.js and builds a control for every
 * entry, so adding a knob to the config automatically adds it here.
 *
 * Save model — two separate states:
 *
 *   config   what you see right now. Every slider move updates this and repaints
 *            the preview immediately, but touches nothing on disk.
 *   applied  what was last SAVED. Only "Apply & Save" copies config -> applied
 *            and writes it to localStorage.
 *
 * So you can explore freely and only commit what you actually want. The panel
 * shows "● unsaved changes" whenever the two differ, Revert throws away the
 * exploration and returns to the last saved state, and Reset goes back to the
 * brand defaults.
 *
 * Press "C" to hide/show the panel (for clean screenshots).
 */

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

/**
 * @param {object}   o
 * @param {object}   o.defaults    the config object this preview starts from
 * @param {Array}    o.schema      control descriptors (groups of controls)
 * @param {object}   [o.presets]   named partial configs, deep-merged over defaults
 * @param {string}   o.storageKey  localStorage key for the saved config
 * @param {function} o.onChange    called with the live config on every edit
 * @param {string}   [o.subtitle]  small text under the panel title
 * @param {string}   [o.exportName] filename for Export JSON
 * @param {Array}    [o.actions]   extra footer buttons: [{ label, onClick }]
 */
function createControlPanel({
  defaults: DEFAULTS,
  schema: SCHEMA,
  presets: PRESETS = {},
  storageKey,
  onChange,
  // Called after a successful Apply & Save with the applied config — lets the
  // page persist the settings somewhere beyond localStorage (e.g. into its own
  // HTML file via the File System Access API).
  onSave,
  subtitle = '',
  exportName = 'sovstac.config.json',
  actions = [],
}) {
  const style = el('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  // `applied` = last saved. `config` = live, possibly unsaved.
  let applied = clone(DEFAULTS);
  try {
    const saved = localStorage.getItem(storageKey);
    if (saved) applied = deepMerge(DEFAULTS, JSON.parse(saved));
  } catch {
    /* corrupt storage — fall back to brand defaults */
  }
  let config = clone(applied);

  const panel = el('div', 'sv-panel');
  const fab = el('button', 'sv-fab', '☰');
  const toast = el('div', 'sv-toast');

  /* header */
  const head = el('div', 'sv-head');
  const titleWrap = el('div');
  titleWrap.appendChild(el('div', 'sv-title', 'Sovstac Control'));
  titleWrap.appendChild(el('div', 'sv-sub', subtitle));
  const closeBtn = el('button', 'sv-close', '✕');
  head.append(titleWrap, closeBtn);

  const body = el('div', 'sv-body');
  const foot = el('div', 'sv-foot');

  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.dataset.show = 'true';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (toast.dataset.show = 'false'), 1800);
  }

  const isDirty = () => JSON.stringify(config) !== JSON.stringify(applied);

  const dirtyNote = el('div', 'sv-dirty');
  const applyBtn = el('button', 'sv-btn sv-btn--apply sv-btn--wide', 'Apply & Save');

  function refreshDirty() {
    const dirty = isDirty();
    applyBtn.dataset.dirty = String(dirty);
    dirtyNote.textContent = dirty ? '● unsaved changes' : '';
  }

  /** Live preview only — nothing is persisted until Apply. */
  function commit() {
    onChange(config);
    refreshDirty();
  }

  applyBtn.onclick = () => {
    if (!isDirty()) return;
    applied = clone(config);
    try {
      localStorage.setItem(storageKey, JSON.stringify(applied));
      showToast('Applied & saved');
    } catch {
      showToast('Applied (storage unavailable)');
    }
    refreshDirty();
    // Synchronous call so a file picker inside onSave still counts as part of
    // the click's user gesture.
    onSave?.(clone(applied), { showToast });
  };

  const exportBtn = el('button', 'sv-btn', 'Export JSON');
  exportBtn.onclick = () => {
    const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
    const a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = exportName;
    a.click();
    URL.revokeObjectURL(a.href);
    showToast(`Exported ${exportName}`);
  };

  const revertBtn = el('button', 'sv-btn', 'Revert');
  revertBtn.onclick = () => {
    config = clone(applied);
    rebuild();
    commit();
    showToast('Reverted to last saved');
  };

  const resetBtn = el('button', 'sv-btn sv-btn--wide', 'Reset to brand defaults');
  resetBtn.onclick = () => {
    config = clone(DEFAULTS);
    applied = clone(DEFAULTS);
    localStorage.removeItem(storageKey);
    rebuild();
    commit();
    showToast('Reset to brand defaults');
  };

  /* presets — only shown if this preview defines any */
  if (Object.keys(PRESETS).length) {
    const presets = el('div', 'sv-presets');
    presets.appendChild(el('label', null, 'Preset'));
    const presetSel = el('select');
    Object.keys(PRESETS).forEach(k => presetSel.appendChild(new Option(k, k)));
    presetSel.onchange = () => {
      config = deepMerge(DEFAULTS, PRESETS[presetSel.value]);
      rebuild();
      commit();
      showToast(`${presetSel.value} — press Apply to save`);
    };
    presets.appendChild(presetSel);
    body.appendChild(presets);
  }

  const groupsWrap = el('div');
  body.appendChild(groupsWrap);

  const openState = {};

  function buildControl(c) {
    const wrap = el('div', 'sv-ctrl');
    const value = getPath(config, c.path);

    if (c.type === 'toggle') {
      const row = el('div', 'sv-toggle');
      row.appendChild(el('span', 'sv-ctrl-label', c.label));
      const sw = el('button', 'sv-switch');
      sw.dataset.on = String(!!value);
      sw.onclick = () => {
        const next = !getPath(config, c.path);
        setPath(config, c.path, next);
        sw.dataset.on = String(next);
        commit();
      };
      row.appendChild(sw);
      wrap.appendChild(row);
      return wrap;
    }

    const top = el('div', 'sv-ctrl-top');
    top.appendChild(el('span', 'sv-ctrl-label', c.label));
    const valOut = el('span', 'sv-ctrl-value');
    if (c.type === 'range') valOut.textContent = `${value}${c.unit || ''}`;
    top.appendChild(valOut);
    wrap.appendChild(top);

    if (c.type === 'range') {
      const input = el('input');
      input.type = 'range';
      input.min = c.min; input.max = c.max; input.step = c.step; input.value = value;
      input.oninput = () => {
        const n = parseFloat(input.value);
        setPath(config, c.path, n);
        valOut.textContent = `${n}${c.unit || ''}`;
        commit();
      };
      wrap.appendChild(input);
    } else if (c.type === 'color') {
      const row = el('div', 'sv-color');
      const picker = el('input');
      picker.type = 'color';
      picker.value = value;
      const hex = el('input');
      hex.type = 'text';
      hex.value = value;

      const set = v => {
        setPath(config, c.path, v);
        picker.value = v;
        hex.value = v;
        commit();
      };
      picker.oninput = () => set(picker.value);
      hex.onchange = () => {
        // Only a full 6-digit hex is accepted; anything else snaps back.
        if (/^#[0-9a-f]{6}$/i.test(hex.value.trim())) set(hex.value.trim());
        else hex.value = getPath(config, c.path);
      };

      row.append(picker, hex);
      wrap.appendChild(row);

      const sw = el('div', 'sv-swatches');
      BRAND_SWATCHES.forEach(s => {
        const b = el('button', 'sv-swatch');
        b.style.background = s;
        b.title = s;
        b.onclick = () => set(s);
        sw.appendChild(b);
      });
      wrap.appendChild(sw);
    } else if (c.type === 'select') {
      const sel = el('select');
      c.options.forEach(o => sel.appendChild(new Option(o, o)));
      sel.value = value;
      sel.onchange = () => {
        setPath(config, c.path, sel.value);
        commit();
      };
      wrap.appendChild(sel);
    } else if (c.type === 'textarea') {
      const ta = el('textarea');
      ta.value = value;
      ta.oninput = () => {
        setPath(config, c.path, ta.value);
        commit();
      };
      wrap.appendChild(ta);
    } else {
      const input = el('input');
      input.type = 'text';
      input.value = value;
      input.oninput = () => {
        setPath(config, c.path, input.value);
        commit();
      };
      wrap.appendChild(input);
    }

    return wrap;
  }

  function rebuild() {
    groupsWrap.innerHTML = '';
    SCHEMA.forEach((g, i) => {
      const group = el('div', 'sv-group');
      if (openState[g.group] === undefined) openState[g.group] = i < 2;
      group.dataset.open = String(openState[g.group]);

      const gh = el('button', 'sv-group-head');
      gh.appendChild(el('span', 'sv-icon', g.icon));
      gh.appendChild(el('span', null, g.group));
      gh.appendChild(el('span', 'sv-caret', '▾'));
      gh.onclick = () => {
        openState[g.group] = !openState[g.group];
        group.dataset.open = String(openState[g.group]);
      };

      const gb = el('div', 'sv-group-body');
      g.controls.forEach(c => gb.appendChild(buildControl(c)));

      group.append(gh, gb);
      groupsWrap.appendChild(group);
    });
  }

  // Preview-specific buttons (e.g. "Replay" on an animation) go above the save row.
  const actionBtns = actions.map(a => {
    const b = el('button', 'sv-btn sv-btn--wide', a.label);
    b.onclick = () => a.onClick(config);
    return b;
  });

  foot.append(...actionBtns, dirtyNote, applyBtn, exportBtn, revertBtn, resetBtn);
  panel.append(head, body, foot);
  document.body.append(panel, fab, toast);

  const setHidden = h => {
    panel.dataset.hidden = String(h);
    fab.dataset.show = String(h);
  };
  closeBtn.onclick = () => setHidden(true);
  fab.onclick = () => setHidden(false);

  window.addEventListener('keydown', e => {
    // Ignore the shortcut while typing into a field.
    const t = e.target;
    if (t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement || t instanceof HTMLSelectElement) return;
    if (e.key === 'c' || e.key === 'C') setHidden(panel.dataset.hidden !== 'true');
  });

  // Don't let unsaved tuning vanish on a reload.
  window.addEventListener('beforeunload', e => {
    if (isDirty()) e.preventDefault();
  });

  rebuild();
  commit();

  return { getConfig: () => config, showToast };
}



/* ===== page ===== */



const $ = id => document.getElementById(id);
const root = document.documentElement;

const scrub = $('scrub');
const timeOut = $('time');
const playBtn = $('playBtn');

let scrubbing = false;

const reveal = createLogoReveal($('reveal'), DEFAULTS, {
  onProgress: (p, dur) => {
    if (!scrubbing) scrub.value = String(Math.round(p * 1000));
    timeOut.textContent = `${(p * dur).toFixed(2)} / ${dur.toFixed(2)}s`;
    playBtn.textContent = reveal.isPaused() ? '▶' : '❚❚';
  },
});

function render(c) {
  root.style.setProperty('--sv-bg', c.palette.bg);
  root.style.setProperty('--sv-accent', c.palette.bracketSealed);
  root.style.setProperty('--fx-glow', c.effects.glow);
  root.style.setProperty('--fx-vignette', c.effects.vignette);
  root.style.setProperty('--fx-grain', c.effects.grain);
  reveal.update(c);
}

const panel = createControlPanel({
  defaults: DEFAULTS,
  schema: SCHEMA,
  presets: PRESETS,
  storageKey: 'sovstac.logo-reveal.config',
  subtitle: 'logo reveal — C hide · Space play · R replay',
  exportName: 'sovstac-logo-reveal.config.json',
  onChange: render,
  actions: [{ label: '↺ Replay', onClick: () => reveal.restart() }],
});

/* transport wiring */
playBtn.onclick = () => {
  reveal.toggle();
  playBtn.textContent = reveal.isPaused() ? '▶' : '❚❚';
};
$('replayBtn').onclick = () => reveal.restart();

// Scrubbing pauses, so you can park on a frame and tune it.
scrub.oninput = () => {
  scrubbing = true;
  reveal.pause();
  reveal.seek(Number(scrub.value) / 1000);
  playBtn.textContent = '▶';
};
scrub.onchange = () => { scrubbing = false; };

window.addEventListener('keydown', e => {
  const t = e.target;
  if (t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement || t instanceof HTMLSelectElement) return;

  if (e.code === 'Space') {
    e.preventDefault();
    reveal.toggle();
    playBtn.textContent = reveal.isPaused() ? '▶' : '❚❚';
  }
  if (e.key === 'r' || e.key === 'R') reveal.restart();
  if (e.key === 'c' || e.key === 'C') {
    const tr = $('transport');
    tr.dataset.hidden = tr.dataset.hidden === 'true' ? 'false' : 'true';
  }
});

// Fonts must land before Michroma can be measured, else the letters mis-place.
document.fonts.ready.then(() => reveal.restart());


</script>
</body>
